name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Ensure Gradle Wrapper & Keystore
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew || true
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --continue
          else
            gradle testDebugUnitTest --continue
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="${GITHUB_REF_NAME:-v1.0.0}"
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          cp "$APK_FILE" "release-artifacts/ProxoQlyps-${VERSION_TAG}.apk"
          cd release-artifacts
          sha256sum "ProxoQlyps-${VERSION_TAG}.apk" > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${GITHUB_REF_NAME:-v1.0.0}"
          gh release create "${VERSION_TAG}" \
            release-artifacts/ProxoQlyps-${VERSION_TAG}.apk \
            release-artifacts/SHA256SUMS.txt \
            --title "Proxo-Qlyps ${VERSION_TAG}" \
            --generate-notes || true
