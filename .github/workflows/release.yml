name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="${GITHUB_REF_NAME:-v1.0.0}"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          cp "$APK_FILE" "release-artifacts/ProxoQlyps-${VERSION_TAG}.apk"
          cd release-artifacts
          sha256sum "ProxoQlyps-${VERSION_TAG}.apk" > SHA256SUMS.txt
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxo-qlyps-release-apk
          path: release-artifacts/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" release-artifacts/* --clobber
          else
            gh release create "${VERSION_TAG}" \
              release-artifacts/* \
              --title "Proxo-Qlyps ${VERSION_TAG}" \
              --generate-notes
          fi
